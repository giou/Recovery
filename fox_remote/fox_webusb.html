<!doctype html>
<!--
  OrangeFox Remote — WebUSB (ADB) client
  ======================================
  Reference web client that drives a device's OrangeFox recovery over a USB
  cable, with no host-side adb binary, using WebUSB + the ya-webadb (Tango)
  JavaScript ADB stack.

  This file is NOT compiled into recovery. It is a static page that must be
  served from a secure context (https:// or http://localhost) because WebUSB is
  only available in secure contexts. Host it on e.g. GitHub Pages, or open it
  from a local dev server.

  How it works (see the device-side fox_remote/fox_httpd.cpp / Fox_CLI::Cmd_Remote):
    1. Connect to the device over WebUSB (ADB handshake via ya-webadb).
    2. Run `fox remote start` over an ADB shell; parse `port=` and `token=`.
    3. Open ADB `tcp:<port>` sockets to localhost on the device and speak plain
       HTTP to the already-running fox_httpd, reusing every REST endpoint, the
       screen capture and the uinput injection — exactly the same server the
       WLAN dashboard uses.

  IMPORTANT version note: the ya-webadb / @yume-chan API surface changes between
  releases (stream/Consumable wrapping, subprocess entry points). This file
  targets the @yume-chan/* line published on esm.sh and pins versions below.
  If an import or call signature mismatches your pinned version, adjust the two
  marked spots (CONNECT and SHELL). The HTTP-over-socket logic is stable.

  Requirements / friction (read this):
    - Chrome/Edge/Opera (WebUSB). Not Firefox/Safari.
    - The OS adb server will fight for the USB interface. Run `adb kill-server`
      first (Linux/macOS). On Windows the ADB interface needs the WinUSB driver
      (use Zadig) so the browser can claim it.
    - Recovery adbd must accept the connection. OrangeFox recovery normally has
      adb enabled; ya-webadb performs the RSA auth handshake. If your adbd has
      auth enabled and no way to accept the key in recovery, disable adb auth in
      recovery (ro.adb.secure=0) or pre-authorize the browser key.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OrangeFox Remote · WebUSB</title>
<style>
  :root { --bg:#161318; --fg:#f3eef6; --accent:#ff7a18; --muted:#8a8590; --panel:#211c25; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:.6rem; padding:.6rem .9rem; background:var(--panel); position:sticky; top:0; z-index:2; }
  header b { color:var(--accent); }
  .wrap { display:flex; flex-wrap:wrap; gap:1rem; padding:1rem; }
  .screen { flex:1 1 320px; min-width:280px; }
  .screen img { width:100%; background:#000; border:1px solid #3a3340; border-radius:8px; touch-action:none; cursor:crosshair; }
  .side { flex:1 1 320px; min-width:280px; display:flex; flex-direction:column; gap:.8rem; }
  .card { background:var(--panel); border:1px solid #3a3340; border-radius:8px; padding:.8rem; }
  .card h3 { margin:.1rem 0 .6rem; font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  input, button { font:inherit; }
  input[type=text] { width:100%; padding:.5rem; border-radius:6px; border:1px solid #3a3340; background:#15121a; color:var(--fg); }
  button { padding:.5rem .8rem; border-radius:6px; border:1px solid #3a3340; background:#2c2531; color:var(--fg); cursor:pointer; }
  button.accent { background:var(--accent); color:#161318; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:.4rem; flex-wrap:wrap; }
  .keys button, .quick button { flex:1 1 auto; }
  pre { background:#100d13; border-radius:6px; padding:.6rem; max-height:42vh; overflow:auto; white-space:pre-wrap; font-size:.8rem; margin:0; }
  .muted { color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<header>
  <b>🦊 OrangeFox</b><span>Remote · WebUSB</span>
  <span id="state" class="muted" style="margin-left:auto">disconnected</span>
</header>
<div class="wrap">
  <div class="screen card">
    <h3>Screen</h3>
    <img id="screen" alt="device screen">
    <div class="row" style="margin-top:.5rem">
      <label class="muted"><input type="checkbox" id="livetouch" checked> tap-to-touch</label>
      <label class="muted">fps <input type="text" id="fps" value="1.5" style="width:3rem"></label>
    </div>
  </div>
  <div class="side">
    <div class="card">
      <h3>Connection</h3>
      <div class="row">
        <button class="accent" id="connect">Connect USB</button>
        <button id="disconnect" disabled>Disconnect</button>
      </div>
      <div id="dim" class="muted" style="margin-top:.4rem"></div>
    </div>
    <div class="card keys">
      <h3>Keys</h3>
      <div class="row">
        <button onclick="key('back')">Back</button>
        <button onclick="key('home')">Home</button>
        <button onclick="key('menu')">Menu</button>
        <button onclick="key('volup')">Vol+</button>
        <button onclick="key('voldown')">Vol-</button>
        <button onclick="key('power')">Power</button>
      </div>
    </div>
    <div class="card">
      <h3>Command</h3>
      <input type="text" id="cmd" placeholder="e.g. status   |   wlan info" onkeydown="if(event.key==='Enter')runCmd()">
      <div class="row quick" style="margin-top:.5rem">
        <button onclick="quick('status')">status</button>
        <button onclick="quick('storages')">storages</button>
        <button onclick="quick('mount')">mount</button>
        <button onclick="quick('log')">log</button>
      </div>
      <div class="row" style="margin-top:.5rem"><button class="accent" onclick="runCmd()">Run</button></div>
    </div>
    <div class="card">
      <h3>Output</h3>
      <pre id="out">(not connected)</pre>
    </div>
  </div>
</div>

<script type="module">
// ---- ya-webadb (Tango) imports. Pin versions; bump together. -----------------
// CONNECT marker: if your pinned version differs, this import block + connect()
// are the spots most likely to need tweaks.
import { Adb, AdbDaemonTransport } from "https://esm.sh/@yume-chan/adb@1.1.0";
import { AdbDaemonWebUsbDeviceManager } from "https://esm.sh/@yume-chan/adb-daemon-webusb@1.1.0";
import AdbWebCredentialStore from "https://esm.sh/@yume-chan/adb-credential-web@1.1.0";

const $ = s => document.querySelector(s);
let adb = null;          // connected Adb instance
let PORT = 8080;
let TOKEN = "";
let fbw = 0, fbh = 0;
let streamTimer = null;
let connected = false;

const dec = new TextDecoder();
const enc = new TextEncoder();

function setState(s){ $("#state").textContent = s; }

// ---- Connect over WebUSB -----------------------------------------------------
$("#connect").addEventListener("click", connect);
$("#disconnect").addEventListener("click", disconnect);

async function connect(){
  try {
    const manager = AdbDaemonWebUsbDeviceManager.BROWSER;
    if(!manager){ alert("WebUSB not available. Use Chrome/Edge over https or localhost."); return; }
    setState("requesting device…");
    const device = await manager.requestDevice();   // shows the browser USB picker
    if(!device){ setState("disconnected"); return; }
    const connection = await device.connect();
    const credentialStore = new AdbWebCredentialStore("OrangeFox Remote");
    setState("authenticating (accept on device if prompted)…");
    const transport = await AdbDaemonTransport.authenticate({
      serial: device.serial,
      connection,
      credentialStore,
    });
    adb = new Adb(transport);
    connected = true;
    $("#connect").disabled = true;
    $("#disconnect").disabled = false;
    setState("starting remote…");
    await bootstrap();
  } catch(e){
    console.error(e);
    setState("error: " + e.message);
  }
}

async function disconnect(){
  stopStream();
  try { if(adb) await adb.close(); } catch(e){}
  adb = null; connected = false; TOKEN = "";
  $("#connect").disabled = false;
  $("#disconnect").disabled = true;
  setState("disconnected");
  $("#out").textContent = "(not connected)";
}

// ---- Bootstrap: run `fox remote start`, parse token/port ---------------------
// SHELL marker: subprocess entry point differs across versions. The helper
// tries the common ones.
async function shellText(command){
  const sp = adb.subprocess;
  // Newest API: noneProtocol.spawnWaitText
  if(sp.noneProtocol && sp.noneProtocol.spawnWaitText)
    return await sp.noneProtocol.spawnWaitText(command);
  // Some versions: subprocess.spawnAndWaitLegacy / shellLegacy
  if(sp.spawnAndWaitLegacy){
    const out = await sp.spawnAndWaitLegacy(command);
    return typeof out === "string" ? out : dec.decode(out);
  }
  // Fallback: shell() returning a process with stdout stream
  const proc = await (sp.shell ? sp.shell(command) : sp.spawn(command));
  const reader = proc.stdout.getReader();
  let text = "";
  for(;;){ const {done,value} = await reader.read(); if(done) break; text += dec.decode(value); }
  return text;
}

async function bootstrap(){
  const out = await shellText("fox remote start");
  const portM = out.match(/port=(\d+)/);
  const tokM  = out.match(/token=([0-9a-f]+)/i);
  if(portM) PORT = parseInt(portM[1], 10);
  if(tokM)  TOKEN = tokM[1];
  if(!TOKEN){
    setState("could not parse token; raw: " + out.slice(0,120));
    return;
  }
  setState("connected");
  await refreshStatus();
  startStream();
  $("#out").textContent = "";
}

// ---- HTTP over an ADB tcp: socket -------------------------------------------
// Opens a fresh ADB stream to localhost:PORT per request (the server replies
// Connection: close), writes a raw HTTP request, reads the full response.
async function adbHttp(method, path, { body=null, contentType="application/json" } = {}){
  if(!adb) throw new Error("not connected");
  const socket = await adb.createSocket("tcp:" + PORT);

  // ---- write request ----
  const sep = path.includes("?") ? "&" : "?";
  const full = path + sep + "token=" + encodeURIComponent(TOKEN);
  let head = `${method} ${full} HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n`;
  let bodyBytes = null;
  if(body != null){
    bodyBytes = enc.encode(body);
    head += `Content-Type: ${contentType}\r\nContent-Length: ${bodyBytes.length}\r\n`;
  }
  head += "\r\n";

  const writer = socket.writable.getWriter();
  await writeChunk(writer, enc.encode(head));
  if(bodyBytes) await writeChunk(writer, bodyBytes);
  try { await writer.close(); } catch(e){ writer.releaseLock(); }

  // ---- read full response ----
  const reader = socket.readable.getReader();
  const chunks = []; let total = 0;
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    const u8 = toU8(value);
    chunks.push(u8); total += u8.length;
  }
  const buf = new Uint8Array(total);
  let off = 0; for(const c of chunks){ buf.set(c, off); off += c.length; }
  return parseHttp(buf);
}

// Some Tango versions wrap writable in Consumable<Uint8Array>; handle both.
async function writeChunk(writer, u8){
  try { await writer.write(u8); }
  catch(e){
    // retry as Consumable if the stream demands it
    const mod = await import("https://esm.sh/@yume-chan/stream-extra@1.1.0");
    await writer.write(new mod.Consumable(u8));
  }
}
function toU8(value){
  if(value instanceof Uint8Array) return value;
  if(value && value.value instanceof Uint8Array) return value.value; // Consumable
  return new Uint8Array(value);
}

function parseHttp(buf){
  // find header/body boundary
  let i = 0;
  for(; i < buf.length - 3; i++){
    if(buf[i]===13 && buf[i+1]===10 && buf[i+2]===13 && buf[i+3]===10) break;
  }
  const headerText = dec.decode(buf.subarray(0, i));
  const bodyBytes = buf.subarray(i + 4);
  const statusLine = headerText.split("\r\n")[0] || "";
  const status = parseInt(statusLine.split(" ")[1] || "0", 10);
  return { status, headerText, bodyBytes,
           text: () => dec.decode(bodyBytes),
           json: () => JSON.parse(dec.decode(bodyBytes)) };
}

// ---- Status / screen --------------------------------------------------------
async function refreshStatus(){
  try {
    const r = await adbHttp("GET", "/api/status");
    if(r.status !== 200){ setState("status " + r.status); return; }
    const j = r.json();
    fbw = j.width; fbh = j.height;
    $("#dim").textContent = j.width + "×" + j.height + (j.input_ready ? " · input ✓" : " · input ✗");
  } catch(e){ console.error(e); }
}

function startStream(){ stopStream(); pumpFrame(); }
function stopStream(){ if(streamTimer){ clearTimeout(streamTimer); streamTimer = null; } }
async function pumpFrame(){
  if(!connected) return;
  try {
    const r = await adbHttp("GET", "/screen.png");
    if(r.status === 200 && r.bodyBytes.length){
      const blob = new Blob([r.bodyBytes], { type: "image/png" });
      const url = URL.createObjectURL(blob);
      const img = $("#screen");
      const old = img.src;
      img.src = url;
      if(old.startsWith("blob:")) URL.revokeObjectURL(old);
    }
  } catch(e){ /* transient */ }
  const fps = Math.max(0.2, Math.min(10, parseFloat($("#fps").value) || 1.5));
  streamTimer = setTimeout(pumpFrame, 1000 / fps);
}

// ---- Input ------------------------------------------------------------------
function mapCoords(ev){
  const img = $("#screen");
  const rect = img.getBoundingClientRect();
  const w = fbw || img.naturalWidth || rect.width;
  const h = fbh || img.naturalHeight || rect.height;
  return {
    x: Math.round((ev.clientX - rect.left) / rect.width * w),
    y: Math.round((ev.clientY - rect.top) / rect.height * h),
  };
}
async function touch(x, y, action){
  try { await adbHttp("POST", "/api/input/touch", { body: JSON.stringify({x,y,action}) }); } catch(e){}
}
(function(){
  const img = $("#screen");
  let down = false;
  img.addEventListener("pointerdown", e => { if(!$("#livetouch").checked||!connected) return; e.preventDefault(); down=true; const p=mapCoords(e); touch(p.x,p.y,"down"); });
  img.addEventListener("pointermove", e => { if(!down) return; e.preventDefault(); const p=mapCoords(e); touch(p.x,p.y,"move"); });
  img.addEventListener("pointerup",   e => { if(!down) return; e.preventDefault(); down=false; touch(0,0,"up"); });
  img.addEventListener("pointercancel", e => { if(down){ down=false; touch(0,0,"up"); } });
})();
window.key = async function(name){ if(!connected) return; try { await adbHttp("POST","/api/input/key",{body:JSON.stringify({key:name,action:"tap"})}); } catch(e){} };

// ---- Command + output polling ----------------------------------------------
let curJob = 0, curOff = 0, jobTimer = null;
window.runCmd = async function(){
  if(!connected) return;
  const raw = $("#cmd").value.trim();
  if(!raw) return;
  const argv = raw.split(/\s+/);
  const r = await adbHttp("POST", "/api/cmd", { body: JSON.stringify({argv}) });
  const j = r.json();
  if(j.id){ curJob = j.id; curOff = 0; $("#out").textContent = ""; pollJob(); }
  else $("#out").textContent = "error: " + JSON.stringify(j);
};
window.quick = function(v){ $("#cmd").value = v; runCmd(); };
async function pollJob(){
  if(!curJob || !connected) return;
  try {
    const r = await adbHttp("GET", "/api/jobs/" + curJob + "/output?offset=" + curOff);
    if(r.status === 200){
      const j = r.json();
      if(j.data){ $("#out").textContent += j.data; $("#out").scrollTop = $("#out").scrollHeight; }
      curOff = j.offset;
      if(j.state === "done"){ $("#out").textContent += "\n[exit " + j.exit_code + "]\n"; curJob = 0; return; }
    }
  } catch(e){}
  jobTimer = setTimeout(pollJob, 600);
}
</script>
</body>
</html>
