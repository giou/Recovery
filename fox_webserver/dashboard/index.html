<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OrangeFox Remote</title>
<style>
  :root { --bg:#161318; --fg:#f3eef6; --accent:#ff7a18; --muted:#8a8590; --panel:#211c25; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:.6rem; padding:.6rem .9rem; background:var(--panel); position:sticky; top:0; z-index:2; }
  header b { color:var(--accent); }
  .wrap { display:flex; flex-wrap:wrap; gap:1rem; padding:1rem; }
  .screen { flex:1 1 320px; min-width:280px; }
  .screen img { width:100%; background:#000; border:1px solid #3a3340; border-radius:8px; touch-action:none; cursor:crosshair; }
  .side { flex:1 1 320px; min-width:280px; display:flex; flex-direction:column; gap:.8rem; }
  .card { background:var(--panel); border:1px solid #3a3340; border-radius:8px; padding:.8rem; }
  .card h3 { margin:.1rem 0 .6rem; font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  input, button, select { font:inherit; }
  input[type=text], input[type=password], input[type=number] { width:100%; padding:.5rem; border-radius:6px; border:1px solid #3a3340; background:#15121a; color:var(--fg); }
  button { padding:.5rem .8rem; border-radius:6px; border:1px solid #3a3340; background:#2c2531; color:var(--fg); cursor:pointer; }
  button.accent { background:var(--accent); color:#161318; border-color:var(--accent); font-weight:600; }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:.4rem; flex-wrap:wrap; }
  .keys button { flex:1 1 auto; }
  .tabs button { flex:1 1 0; }
  pre { background:#100d13; border-radius:6px; padding:.6rem; max-height:42vh; overflow:auto; white-space:pre-wrap; font-size:.8rem; margin:0; }
  iframe.terminal { width:100%; height:360px; border:1px solid #3a3340; border-radius:6px; background:#000; }
  .muted { color:var(--muted); font-size:.8rem; }
  code { background:#100d13; padding:.05rem .3rem; border-radius:4px; }
  .quick button { flex:1 1 30%; }
</style>
</head>
<body>
<header><b>🦊 OrangeFox</b> <span>Remote</span> <span id="dim" class="muted" style="margin-left:auto"></span></header>
<div class="wrap">
  <div class="screen card">
    <h3>Screen</h3>
    <img id="screen" alt="screen">
    <div class="row" style="margin-top:.5rem">
      <button onclick="reloadStream()">Reconnect</button>
      <label class="muted"><input type="checkbox" id="livetouch" checked> tap-to-touch</label>
    </div>
  </div>
  <div class="side">
    <div class="card">
      <h3>Connection</h3>
      <div class="row tabs" id="provtabs">
        <button class="prov accent" data-prov="rest">REST PNG</button>
        <button class="prov" data-prov="restmjpeg">REST MJPEG</button>
        <button class="prov" data-prov="usb">USB (WebUSB)</button>
        <button class="prov" data-prov="usbstream">USB Stream</button>
        <button class="prov" data-prov="usbtunnel">USB Tunnel</button>
      </div>
      <div id="rest-fields" style="margin-top:.6rem">
        <input type="text" id="host" placeholder="device IP (e.g. 192.168.1.50)" autocomplete="off" autocapitalize="off" spellcheck="false">
        <input type="password" id="token" placeholder="session token" style="margin-top:.4rem">
        <div class="row" style="margin-top:.5rem">
          <button class="accent" id="rest-connect">Connect</button>
        </div>
      </div>
      <div id="usb-fields" style="margin-top:.6rem; display:none">
        <div class="row">
          <button class="accent" id="usb-connect">Connect USB</button>
          <button id="usb-disconnect" disabled>Disconnect</button>
        </div>
        <div class="row" style="margin-top:.5rem">
          <input type="number" id="usb-fps" min="1" max="30" value="10" title="Stream FPS">
          <button id="usb-stop-stream" disabled>Stop Stream</button>
        </div>
        <div class="muted" style="margin-top:.4rem">Chrome/Edge over https or localhost. Run <code>adb kill-server</code> first; accept the key on the device.</div>
      </div>
      <div class="row" style="margin-top:.5rem">
        <span id="status" class="muted"></span>
      </div>
    </div>
    <div class="card keys">
      <h3>Keys</h3>
      <div class="row">
        <button onclick="key('back')">Back</button>
        <button onclick="key('home')">Home</button>
        <button onclick="key('menu')">Menu</button>
        <button onclick="key('volup')">Vol+</button>
        <button onclick="key('voldown')">Vol-</button>
        <button onclick="key('power')">Power</button>
      </div>
    </div>
    <div class="card">
      <h3>Command</h3>
      <input type="text" id="cmd" placeholder="e.g. status   |   wlan info" onkeydown="if(event.key==='Enter')runCmd()">
      <div class="row quick" style="margin-top:.5rem">
        <button onclick="quick('status')">status</button>
        <button onclick="quick('storages')">storages</button>
        <button onclick="quick('mount')">mount</button>
        <button onclick="quick('backup')">backup list</button>
        <button onclick="quick('log')">log</button>
      </div>
      <div class="row" style="margin-top:.5rem"><button class="accent" onclick="runCmd()">Run</button></div>
    </div>
    <div class="card">
      <h3>Output</h3>
      <pre id="out">(no job yet)</pre>
    </div>
    <div class="card">
      <h3>Terminal</h3>
      <div class="row" style="margin-bottom:.5rem">
        <button id="ttyd-start" class="accent">Start ttyd</button>
        <button id="ttyd-open">Open</button>
        <button id="ttyd-stop">Stop</button>
      </div>
      <iframe id="ttyd-frame" class="terminal" title="ttyd terminal"></iframe>
      <div id="ttyd-status" class="muted" style="margin-top:.4rem"></div>
    </div>
  </div>
</div>
<script>
// OrangeFox Remote dashboard.
//
// Three interchangeable connection providers expose the SAME interface so the rest
// of the UI does not care which transport is active:
//
//   provider.connect()                  -> establish/validate the connection
//   provider.disconnect()               -> tear it down
//   provider.api(method, path, opts)    -> {status, ok, json(), text(), bodyBytes}
//   provider.startScreen(img) / stopScreen(img)
//
//   * RestProvider  -- talks plain fetch() to the same origin (the in-recovery
//                      HTTP server over WLAN). Screen via /screen.png polling.
//   * RestMjpegProvider -- same REST API, but screen via /stream.mjpeg for
//                      comparing browser multipart rendering behavior.
//   * UsbProvider   -- talks ADB-over-WebUSB (ya-webadb) to a device on a USB
//                      cable and drives `fox screencap` / `fox input` through
//                      the FIFO shell interface. No WLAN or HTTP server needed.
//   * UsbStreamProvider -- same transport as UsbProvider, but starts
//                      `fox screenstream` and reads newline-delimited base64 PNG
//                      frames from /system/bin/foxscreenout. Normal fox FIFO
//                      commands remain available for stop/touch/key.
//   * UsbTunnelProvider -- talks ADB-over-WebUSB, starts the on-device
//                      webserver/control plane, and tunnels HTTP over ADB tcp:.
//                      The WLAN-only feature set thus also works over USB on
//                      sources without WiFi. ya-webadb is lazy-imported on first
//                      USB connect, so the REST path stays fully offline-capable.
const $ = s => document.querySelector(s);
const dec = new TextDecoder();
const enc = new TextEncoder();
const dbg = (...args) => console.log('[OrangeFox WebUSB]', ...args);
const warn = (...args) => console.warn('[OrangeFox WebUSB]', ...args);

function makeResp(status, bodyBytes) {
  return {
    status, ok: status >= 200 && status < 300, bodyBytes,
    text() { return dec.decode(bodyBytes); },
    json() { return JSON.parse(dec.decode(bodyBytes)); },
  };
}

// ---- REST provider (fetch to same origin) ---------------------------------
const RestProvider = {
  id: 'rest',
  token: localStorage.getItem('foxtoken') || '',
  screenTimer: null, screenAbort: null, fps: 8, lastStatus: null,
  // Base URL for the device. Defaults to the IP the page was loaded from; when
  // the field names the same host we keep URLs relative (same-origin, no CORS).
  // A different IP produces an absolute base so the dashboard can be hosted on
  // an *.orangefox.tech / *.orangefox.download origin and point at a device on
  // the LAN (those origins are on the server's default CORS allow-list).
  base() {
    const host = $('#host').value.trim();
    if (!host || host === location.hostname) return '';
    const port = location.port || '80';
    const proto = location.protocol.startsWith('http') ? location.protocol : 'http:';
    return proto + '//' + host + ':' + port;
  },
  async connect() {
    this.token = $('#token').value.trim();
    localStorage.setItem('foxtoken', this.token);
    localStorage.setItem('foxhost', $('#host').value.trim());
    const r = await this.api('GET', '/api/status');
    if (r.status === 401) throw new Error('bad token');
    if (!r.ok) throw new Error('err ' + r.status);
    this.lastStatus = r.json();
  },
  async disconnect() { this.stopScreen(screenEl()); },
  async api(method, path, opts = {}) {
    const sep = path.includes('?') ? '&' : '?';
    const url = this.base() + path + sep + 'token=' + encodeURIComponent(this.token);
    const headers = { 'X-Auth-Token': this.token };
    if (opts.body != null) headers['Content-Type'] = opts.contentType || 'application/json';
    const r = await fetch(url, {
      method, headers,
      body: opts.body != null ? opts.body : null,
      cache: 'no-store',
      signal: opts.signal,
    });
    const buf = new Uint8Array(await r.arrayBuffer());
    return makeResp(r.status, buf);
  },
  startScreen(img) {
    this.stopScreen(img);
    dbg('REST screen pump start');
    const pump = async () => {
      if (provider !== this || !connected) return;
      this.screenAbort = new AbortController();
      try {
        const r = await this.api('GET', '/screen.png?t=' + Date.now(), { signal: this.screenAbort.signal });
        if (r.status === 200 && r.bodyBytes.length) {
          const url = URL.createObjectURL(new Blob([r.bodyBytes], { type: 'image/png' }));
          const old = img.src;
          img.src = url;
          if (old.startsWith('blob:')) URL.revokeObjectURL(old);
          if (connected && provider === this) setStatus('connected');
        } else if (r.status === 403) {
          setStatus('control off');
          return;
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          warn('REST screen pump failed', e);
          if (connected && provider === this) setStatus('REST screen error; see console');
        }
      } finally {
        this.screenAbort = null;
      }
      const fps = Math.max(1, Math.min(12, this.fps));
      this.screenTimer = setTimeout(pump, 1000 / fps);
    };
    pump();
  },
  stopScreen(img) {
    if (this.screenTimer) {
      dbg('REST screen pump stop');
      clearTimeout(this.screenTimer);
      this.screenTimer = null;
    }
    if (this.screenAbort) {
      try { this.screenAbort.abort(); } catch (e) {}
      this.screenAbort = null;
    }
    if (img) img.removeAttribute('src');
  },
};

const RestMjpegProvider = Object.assign(Object.create(RestProvider), {
  id: 'restmjpeg',
  startScreen(img) {
    RestProvider.stopScreen.call(this, img);
    dbg('REST MJPEG stream start');
    img.src = this.base() + '/stream.mjpeg?token=' + encodeURIComponent(this.token) + '&t=' + Date.now();
  },
  stopScreen(img) {
    RestProvider.stopScreen.call(this, img);
  },
});

// ---- WebUSB (ADB) providers ----------------------------------------------
const UsbBase = {
  adb: null, fps: 1.5, screenTimer: null,
  shellQueue: Promise.resolve(), inputActive: false, deferScreenUntil: 0,
  async connect() {
    // Lazy-load ya-webadb so the REST dashboard works with no internet access.
    // CONNECT marker: if a pinned version's API differs, adjust here + _shellText/_shellBytes.
    dbg('loading ya-webadb modules');
    const [adbMod, usbMod, credMod] = await Promise.all([
      import('https://esm.sh/@yume-chan/adb@1.1.0'),
      import('https://esm.sh/@yume-chan/adb-daemon-webusb@1.1.0'),
      import('https://esm.sh/@yume-chan/adb-credential-web@1.1.0'),
    ]);
    const { Adb, AdbDaemonTransport } = adbMod;
    const { AdbDaemonWebUsbDeviceManager } = usbMod;
    const AdbWebCredentialStore = credMod.default;

    const manager = AdbDaemonWebUsbDeviceManager.BROWSER;
    if (!manager) throw new Error('WebUSB unavailable (use Chrome/Edge over https/localhost)');
    dbg('requesting USB device');
    const device = await manager.requestDevice();   // browser USB picker
    if (!device) throw new Error('no device selected');
    dbg('selected USB device', device.serial || '(no serial)');
    const connection = await device.connect();
    dbg('USB transport connected, authenticating ADB');
    const credentialStore = new AdbWebCredentialStore('OrangeFox Remote');
    const transport = await AdbDaemonTransport.authenticate({ serial: device.serial, connection, credentialStore });
    this.adb = new Adb(transport);
    this.shellQueue = Promise.resolve();
    this.inputActive = false;
    this.deferScreenUntil = 0;
    dbg('ADB authenticated');
  },
  async disconnect() {
    this.stopScreen();
    try { if (this.adb) await this.adb.close(); } catch (e) {}
    this.adb = null; this.shellQueue = Promise.resolve();
    this.inputActive = false; this.deferScreenUntil = 0;
  },
  // SHELL marker: subprocess entry point differs across ya-webadb versions.
  async _shellText(command) {
    const bytes = await this._shellBytes(command, true);
    return dec.decode(bytes);
  },
  async _shellBytes(command, preferTextApi = false) {
    const run = () => this._shellBytesRaw(command, preferTextApi);
    const next = this.shellQueue.then(run, run);
    this.shellQueue = next.catch(() => {});
    return await next;
  },
  async _shellBytesRaw(command, preferTextApi = false) {
    dbg('shell start', command);
    const proc = await this._spawn(command, preferTextApi, true);
    if (typeof proc === 'string') {
      dbg('shell done', command, proc.length, 'chars');
      return enc.encode(proc);
    }
    if (proc instanceof Uint8Array) {
      dbg('shell done', command, proc.length, 'bytes');
      return proc;
    }
    const reader = proc.stdout.getReader();
    const chunks = []; let total = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      const u8 = this._toU8(value);
      chunks.push(u8); total += u8.length;
    }
    const buf = new Uint8Array(total);
    let off = 0; for (const c of chunks) { buf.set(c, off); off += c.length; }
    dbg('shell done', command, buf.length, 'bytes');
    return buf;
  },
  async _spawn(command, preferTextApi = false, allowBufferedWait = true) {
    const sp = this.adb.subprocess;
    if (preferTextApi && sp.noneProtocol && sp.noneProtocol.spawnWaitText) {
      return await sp.noneProtocol.spawnWaitText(command);
    }
    if (allowBufferedWait && sp.spawnAndWaitLegacy) {
      const o = await sp.spawnAndWaitLegacy(command);
      return typeof o === 'string' ? enc.encode(o) : this._toU8(o);
    }
    const spawn = sp.noneProtocol && sp.noneProtocol.spawn ? sp.noneProtocol.spawn.bind(sp.noneProtocol) :
                  sp.shell ? sp.shell.bind(sp) :
                  sp.spawn ? sp.spawn.bind(sp) : null;
    if (!spawn) throw new Error('live ADB subprocess streaming is unavailable');
    return await spawn(command);
  },
  _toU8(v) {
    if (v instanceof Uint8Array) return v;
    if (v && v.value instanceof Uint8Array) return v.value;  // Consumable
    return new Uint8Array(v);
  },
  _quoteArg(s) {
    return "'" + String(s).replace(/'/g, "'\\''") + "'";
  },
  async _rpcShell(req) {
    const ndjson = await this._shellText('printf %s ' + this._quoteArg(JSON.stringify(req)) + ' | fox rpc');
    let out = '', code = 1, data = {};
    for (const line of ndjson.split('\n')) {
      if (!line.trim()) continue;
      let ev; try { ev = JSON.parse(line); } catch (_) { out += line + '\n'; continue; }
      if (ev.event === 'log') out += ev.text || '';
      else if (ev.event === 'error') out += (ev.message || 'fox rpc error') + '\n';
      else if (ev.event === 'data') data[ev.name || 'data'] = ev.value;
      else if (ev.event === 'result') code = ev.code | 0;
    }
    return { out, code, data, ndjson };
  },
  _rpcFromArgv(argv) {
    return rpcFromArgv(argv);
  },
  async _writeChunk(writer, u8) {
    try { await writer.write(u8); }
    catch (e) {
      const mod = await import('https://esm.sh/@yume-chan/stream-extra@1.1.0');
      await writer.write(new mod.Consumable(u8));
    }
  },
  startScreen(img) {
    this.stopScreen();
    dbg('screen pump start');
    const pump = async () => {
      if (provider !== this || !this.adb) return;
      try {
        if (this.inputActive || Date.now() < this.deferScreenUntil) {
          this.screenTimer = setTimeout(pump, 80);
          return;
        }
        const r = await this.api('GET', '/screen.png');
        if (r.status === 200 && r.bodyBytes.length) {
          const url = URL.createObjectURL(new Blob([r.bodyBytes], { type: 'image/png' }));
          const old = img.src;
          img.src = url;
          if (old.startsWith('blob:')) URL.revokeObjectURL(old);
          if (connected) setStatus('connected');
        }
      } catch (e) {
        warn('screen pump failed', e);
        if (connected) setStatus('USB screen error; see console');
      }
      const fps = Math.max(0.2, Math.min(10, this.fps));
      this.screenTimer = setTimeout(pump, 1000 / fps);
    };
    pump();
  },
  stopScreen() {
    if (this.screenTimer) {
      dbg('screen pump stop');
      clearTimeout(this.screenTimer);
      this.screenTimer = null;
    }
  },
};

const UsbProvider = Object.assign(Object.create(UsbBase), {
  id: 'usb',
  jobs: {}, nextJob: 1, lastScreen: null,
  async connect() {
    await UsbBase.connect.call(this);
    this.lastScreen = null;
  },
  async disconnect() {
    await UsbBase.disconnect.call(this);
    this.lastScreen = null;
  },
  async api(method, path, opts = {}) {
    if (!this.adb) throw new Error('not connected');

    if (method === 'GET' && path === '/api/status') {
      const png = this.lastScreen || await this._screenBytes();
      const dim = this._pngDims(png);
      return makeResp(200, enc.encode(JSON.stringify({
        width: dim.width, height: dim.height, input_ready: true, control: true
      })));
    }

    if (method === 'GET' && path === '/screen.png') {
      return makeResp(200, await this._screenBytes());
    }

    if (method === 'POST' && path === '/api/input/touch') {
      const j = JSON.parse(opts.body || '{}');
      const action = j.action || 'tap';
      if (action === 'up') await this._inputRpc({ v: 1, op: 'input', args: { action: 'up' } });
      else await this._inputRpc({ v: 1, op: 'input', args: { action, x: j.x | 0, y: j.y | 0 } });
      return makeResp(200, enc.encode('{"ok":true}'));
    }

    if (method === 'POST' && path === '/api/input/key') {
      const j = JSON.parse(opts.body || '{}');
      await this._inputRpc({ v: 1, op: 'input', args: { action: 'key', key: j.key || j.code || '' } });
      return makeResp(200, enc.encode('{"ok":true}'));
    }

    if (method === 'POST' && path === '/api/cmd') {
      const j = JSON.parse(opts.body || '{}');
      const req = j.v === 1 ? j : this._rpcFromArgv(Array.isArray(j.argv) ? j.argv : []);
      const id = this.nextJob++;
      const res = await this._rpcShell(req);
      this.jobs[id] = { data: res.out || res.ndjson, sent: false, exit_code: res.code };
      return makeResp(200, enc.encode(JSON.stringify({ id })));
    }

    if (method === 'GET' && path.startsWith('/api/jobs/')) {
      const m = path.match(/^\/api\/jobs\/(\d+)\/output(?:\?offset=(\d+))?/);
      if (!m || !this.jobs[m[1]]) return makeResp(404, enc.encode('{"error":"not found"}'));
      const job = this.jobs[m[1]];
      const offset = parseInt(m[2] || '0', 10);
      const data = offset > 0 ? '' : job.data;
      const nextOffset = offset + data.length;
      return makeResp(200, enc.encode(JSON.stringify({
        offset: nextOffset, state: 'done', exit_code: job.exit_code, data
      })));
    }

    return makeResp(404, enc.encode('{"error":"not found"}'));
  },
  async _inputRpc(req) {
    this.inputActive = true;
    this.deferScreenUntil = Date.now() + 350;
    try {
      dbg('input rpc', req);
      return await this._rpcShell(req);
    } finally {
      this.inputActive = false;
      this.deferScreenUntil = Date.now() + 180;
    }
  },
  async _screenBytes() {
    dbg('screencap request');
    const res = await this._rpcShell({ v: 1, op: 'screencap', args: { base64: true } });
    const b64 = (res.data.screencap && res.data.screencap.base64) || res.out;
    const png = this._base64ToBytes(b64);
    if (png.length < 24 || png[0] !== 0x89 || png[1] !== 0x50 || png[2] !== 0x4e || png[3] !== 0x47) {
      warn('screencap invalid', png.length, 'base64 preview:', b64.slice(0, 160));
      throw new Error('screencap failed');
    }
    const dim = this._pngDims(png);
    dbg('screencap ok', png.length, 'bytes', dim.width + 'x' + dim.height);
    this._updateDims(dim);
    this.lastScreen = png;
    return png;
  },
  _updateDims(dim) {
    window._fbw = dim.width; window._fbh = dim.height;
    $('#dim').textContent = dim.width + '×' + dim.height + ' · USB';
  },
  _base64ToBytes(text) {
    const clean = text.replace(/[^A-Za-z0-9+/=]/g, '');
    const bin = atob(clean);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },
  _pngDims(png) {
    return {
      width: ((png[16] << 24) | (png[17] << 16) | (png[18] << 8) | png[19]) >>> 0,
      height: ((png[20] << 24) | (png[21] << 16) | (png[22] << 8) | png[23]) >>> 0,
    };
  },
});

const UsbStreamProvider = Object.assign(Object.create(UsbProvider), {
  id: 'usbstream',
  streamReader: null, streamProc: null, streamStopRequested: false,
  async connect() {
    await UsbProvider.connect.call(this);
    this.streamReader = null;
    this.streamProc = null;
    this.streamStopRequested = false;
  },
  async disconnect() {
    await this.stopScreen();
    try { if (this.adb) await this.adb.close(); } catch (e) {}
    this.adb = null; this.shellQueue = Promise.resolve();
    this.inputActive = false; this.deferScreenUntil = 0;
    this.lastScreen = null;
  },
  async startScreen(img) {
    await this.stopScreen(img, true);
    this.streamStopRequested = false;
    $('#usb-stop-stream').disabled = false;
    this._screenStreamLoop(img).catch(e => {
      warn('screen stream failed', e);
      if (!this.streamStopRequested && connected && provider === this)
        setStatus('USB stream error; see console');
      $('#usb-stop-stream').disabled = true;
    });
  },
  async stopScreen(img, restarting = false) {
    this.streamStopRequested = true;
    $('#usb-stop-stream').disabled = true;
    if (this.streamReader) {
      try { await this.streamReader.cancel(); } catch (e) {}
      this.streamReader = null;
    }
    try { if (this.streamProc && this.streamProc.kill) await this.streamProc.kill(); } catch (e) {}
    this.streamProc = null;
    if (this.adb && !restarting) {
      try { await this._rpcShell({ v: 1, op: 'screenstream', args: { action: 'stop' } }); } catch (e) { warn('screenstream stop failed', e); }
    }
    if (img && !restarting) img.removeAttribute('src');
  },
  async _screenStreamLoop(img) {
    const fps = Math.max(1, Math.min(30, parseInt($('#usb-fps').value || '10', 10) || 10));
    dbg('screenstream start', fps, 'fps');
    const startOut = (await this._rpcShell({ v: 1, op: 'screenstream', args: { action: 'start', fps } })).out;
    const pathM = startOut.match(/path=([^\s]+)/);
    const streamPath = pathM ? pathM[1] : '/system/bin/foxscreenout';
    dbg('screenstream output', startOut.trim());
    const proc = await this._spawn('cat ' + this._quoteArg(streamPath), false, false);
    if (typeof proc === 'string' || proc instanceof Uint8Array)
      throw new Error('stream subprocess API returned buffered output');
    this.streamProc = proc;
    const reader = proc.stdout.getReader();
    this.streamReader = reader;

    const streamDec = new TextDecoder();
    let pending = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done || this.streamStopRequested || provider !== this) break;
      pending += streamDec.decode(this._toU8(value), { stream: true });
      const lines = pending.split('\n');
      pending = lines.pop() || '';
      for (const line of lines) {
        const clean = line.trim();
        if (!clean) continue;
        const png = this._base64ToBytes(clean);
        if (png.length < 24 || png[0] !== 0x89 || png[1] !== 0x50 || png[2] !== 0x4e || png[3] !== 0x47) {
          warn('stream frame invalid', png.length, 'preview:', clean.slice(0, 80));
          continue;
        }
        this._showFrame(img, png, 'USB stream');
      }
    }
  },
  _showFrame(img, png, label) {
    const dim = this._pngDims(png);
    this._updateDims(dim);
    $('#dim').textContent = dim.width + '×' + dim.height + ' · ' + label;
    this.lastScreen = png;
    const url = URL.createObjectURL(new Blob([png], { type: 'image/png' }));
    const old = img.src;
    img.src = url;
    if (old.startsWith('blob:')) URL.revokeObjectURL(old);
    if (connected && provider === this) setStatus('connected');
  },
});

const UsbTunnelProvider = Object.assign(Object.create(UsbBase), {
  id: 'usbtunnel',
  port: 80, token: '',
  async connect() {
    await UsbBase.connect.call(this);
    const webOut = (await this._rpcShell({ v: 1, op: 'webserver', args: { action: 'start' } })).out;
    const ctlOut = (await this._rpcShell({ v: 1, op: 'control', args: { action: 'start' } })).out;
    const portM = webOut.match(/port=(\d+)/);
    const tokM = webOut.match(/token=([0-9a-f]+)/i);
    if (portM) this.port = parseInt(portM[1], 10);
    if (tokM) this.token = tokM[1];
    if (!this.token) throw new Error('could not parse token: ' + webOut.slice(0, 120));
    if (!/Remote control enabled|control=1/i.test(ctlOut))
      warn('fox control start output:', ctlOut);
  },
  async disconnect() {
    await UsbBase.disconnect.call(this);
    this.token = '';
  },
  async api(method, path, opts = {}) {
    if (!this.adb) throw new Error('not connected');
    const socket = await this.adb.createSocket('tcp:' + this.port);
    const sep = path.includes('?') ? '&' : '?';
    const full = path + sep + 'token=' + encodeURIComponent(this.token);
    let head = method + ' ' + full + ' HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n';
    let bodyBytes = null;
    if (opts.body != null) {
      bodyBytes = enc.encode(opts.body);
      head += 'Content-Type: ' + (opts.contentType || 'application/json') + '\r\nContent-Length: ' + bodyBytes.length + '\r\n';
    }
    head += '\r\n';

    const writer = socket.writable.getWriter();
    await this._writeChunk(writer, enc.encode(head));
    if (bodyBytes) await this._writeChunk(writer, bodyBytes);
    try { await writer.close(); } catch (e) { writer.releaseLock(); }

    const reader = socket.readable.getReader();
    const chunks = []; let total = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      const u8 = this._toU8(value);
      chunks.push(u8); total += u8.length;
    }
    const buf = new Uint8Array(total);
    let off = 0; for (const c of chunks) { buf.set(c, off); off += c.length; }
    return this._parseHttp(buf);
  },
  _parseHttp(buf) {
    let i = 0;
    for (; i < buf.length - 3; i++)
      if (buf[i] === 13 && buf[i + 1] === 10 && buf[i + 2] === 13 && buf[i + 3] === 10) break;
    const statusLine = dec.decode(buf.subarray(0, i)).split('\r\n')[0] || '';
    const status = parseInt(statusLine.split(' ')[1] || '0', 10);
    return makeResp(status, buf.subarray(i + 4));
  },
});

// ---- shared app logic (provider-agnostic) ---------------------------------
let provider = RestProvider;
let connected = false;
const screenEl = () => $('#screen');

function setStatus(s) { $('#status').textContent = s; }
function applyStatus(j) {
  connected = true;
  setStatus('connected');
  window._control = j.control !== false;  // server omits => assume on
  $('#dim').textContent = j.width + '×' + j.height +
    (j.input_ready ? ' · input ✓' : ' · input ✗') +
    (window._control ? '' : ' · control off');
  window._fbw = j.width; window._fbh = j.height;
}
function providerForId(id) {
  if (id === 'restmjpeg') return RestMjpegProvider;
  if (id === 'usb') return UsbProvider;
  if (id === 'usbstream') return UsbStreamProvider;
  if (id === 'usbtunnel') return UsbTunnelProvider;
  return RestProvider;
}
function isRestProvider(p = provider) { return p === RestProvider || p === RestMjpegProvider; }
function isDirectUsbProvider(p = provider) { return p === UsbProvider || p === UsbStreamProvider; }
function isUsbProvider(p = provider) { return isDirectUsbProvider(p) || p === UsbTunnelProvider; }

function selectProvider(id) {
  if (provider.id === id) return;
  connected = false;
  provider.stopScreen(screenEl());
  if (provider.disconnect) provider.disconnect();
  provider = providerForId(id);
  document.querySelectorAll('.prov').forEach(b => b.classList.toggle('accent', b.dataset.prov === id));
  $('#rest-fields').style.display = isRestProvider() ? '' : 'none';
  $('#usb-fields').style.display = isRestProvider() ? 'none' : '';
  $('#usb-connect').disabled = false;
  $('#usb-disconnect').disabled = true;
  $('#usb-stop-stream').disabled = true;
  setStatus('');
}
document.querySelectorAll('.prov').forEach(b => b.addEventListener('click', () => selectProvider(b.dataset.prov)));

async function connect() {
  try {
    setStatus('connecting…');
    await provider.connect();
    connected = true;
    if (isUsbProvider()) { $('#usb-connect').disabled = true; $('#usb-disconnect').disabled = false; }
    setStatus('connected');
    if (isDirectUsbProvider()) {
      window._control = true;
      provider.startScreen(screenEl());
    } else if (isRestProvider()) {
      if (provider.lastStatus) applyStatus(provider.lastStatus);
      if (window._control !== false) provider.startScreen(screenEl());
    } else {
      await refreshStatus();
      if (window._control !== false) provider.startScreen(screenEl());
    }
  } catch (e) {
    warn('connect failed', e);
    connected = false;
    setStatus(e.message || 'error');
  }
}
$('#rest-connect').addEventListener('click', connect);
$('#usb-connect').addEventListener('click', connect);
$('#usb-disconnect').addEventListener('click', async () => {
  connected = false;
  await provider.disconnect();
  provider.stopScreen(screenEl());
  $('#usb-connect').disabled = false;
  $('#usb-disconnect').disabled = true;
  $('#usb-stop-stream').disabled = true;
  setStatus('disconnected');
  $('#out').textContent = '(not connected)';
});
$('#usb-stop-stream').addEventListener('click', async () => {
  if (provider === UsbStreamProvider) {
    await provider.stopScreen(screenEl());
    setStatus('stream stopped');
  }
});

async function refreshStatus() {
  if (isDirectUsbProvider()) {
    connected = !!provider.adb;
    if (connected) setStatus('connected');
    return;
  }
  try {
    const r = await provider.api('GET', '/api/status');
    if (!r.ok) { setStatus(r.status === 401 ? 'bad token' : 'err ' + r.status); connected = false; return; }
    applyStatus(r.json());
  } catch (e) {
    console.warn('[OrangeFox REST]', 'status failed', e);
    connected = false; setStatus('offline');
  }
}

function reloadStream() { provider.startScreen(screenEl()); }

function mapCoords(ev) {
  const img = $('#screen');
  const rect = img.getBoundingClientRect();
  const w = window._fbw || img.naturalWidth || rect.width;
  const h = window._fbh || img.naturalHeight || rect.height;
  const x = Math.round((ev.clientX - rect.left) / rect.width * w);
  const y = Math.round((ev.clientY - rect.top) / rect.height * h);
  return { x, y };
}
async function touch(x, y, action) {
  try { await provider.api('POST', '/api/input/touch', { body: JSON.stringify({ x, y, action }) }); } catch (e) {}
}
(function () {
  const img = $('#screen');
  let down = false, usbDrag = false, start = null, lastMove = 0;
  const moveThreshold = 8, moveInterval = 70;

  img.addEventListener('pointerdown', e => {
    if (!$('#livetouch').checked || !connected) return;
    e.preventDefault();
    down = true; usbDrag = false; start = mapCoords(e); lastMove = 0;
    try { img.setPointerCapture(e.pointerId); } catch (_) {}
    if (!isDirectUsbProvider())
      touch(start.x, start.y, 'down');
  });

  img.addEventListener('pointermove', e => {
    if (!down) return;
    e.preventDefault();
    const p = mapCoords(e);
    if (!isDirectUsbProvider()) {
      touch(p.x, p.y, 'move');
      return;
    }
    const dx = p.x - start.x, dy = p.y - start.y;
    if (!usbDrag && Math.hypot(dx, dy) >= moveThreshold) {
      usbDrag = true;
      touch(start.x, start.y, 'down');
    }
    const now = Date.now();
    if (usbDrag && now - lastMove >= moveInterval) {
      lastMove = now;
      touch(p.x, p.y, 'move');
    }
  });

  img.addEventListener('pointerup', e => {
    if (!down) return;
    e.preventDefault();
    const p = mapCoords(e);
    down = false;
    try { img.releasePointerCapture(e.pointerId); } catch (_) {}
    if (isDirectUsbProvider()) {
      if (usbDrag) touch(p.x, p.y, 'move').finally(() => touch(0, 0, 'up'));
      else touch(start.x, start.y, 'tap');
    } else {
      touch(0, 0, 'up');
    }
    usbDrag = false; start = null;
  });

  img.addEventListener('pointercancel', e => {
    if (!down) return;
    down = false;
    try { img.releasePointerCapture(e.pointerId); } catch (_) {}
    if (!isDirectUsbProvider() || usbDrag)
      touch(0, 0, 'up');
    usbDrag = false; start = null;
  });
})();

async function key(name) {
  if (!connected) return;
  try { await provider.api('POST', '/api/input/key', { body: JSON.stringify({ key: name, action: 'tap' }) }); } catch (e) {}
}

let pollTimer = null, curJob = 0, curOff = 0;
function rpcFromArgv(argv) {
  const op = argv[0] || 'status';
  const rest = argv.slice(1);
  const args = {};
  if (rest[0]) args.action = rest[0];
  if (rest[1]) args.subaction = rest[1];
  if (rest.length > 2) args.values = rest.slice(2);
  if (op === 'mount' || op === 'unmount') args.paths = rest;
  else if (op === 'backup') args.parts = rest;
  else if (op === 'wipe') args.parts = rest;
  else if (op === 'input') {
    args.action = rest[0] || 'tap';
    if (args.action === 'key') args.key = rest[1] || '';
    else { args.x = rest[1] | 0; args.y = rest[2] | 0; }
  } else if (op === 'screencap') {
    args.base64 = rest.includes('--base64');
  } else if (op === 'screenstream') {
    args.action = rest[0] || 'status';
    const i = rest.indexOf('--fps'); if (i >= 0) args.fps = rest[i + 1] | 0;
  }
  return { v: 1, op, args };
}
async function runCmd() {
  if (!connected) { $('#out').textContent = '(connect first)'; return; }
  const raw = $('#cmd').value.trim();
  if (!raw) return;
  const argv = raw.split(/\s+/);
  try {
    const r = await provider.api('POST', '/api/cmd', { body: JSON.stringify(rpcFromArgv(argv)) });
    const j = r.json();
    if (j.id) { curJob = j.id; curOff = 0; $('#out').textContent = ''; pollJob(); }
    else $('#out').textContent = 'error: ' + JSON.stringify(j);
  } catch (e) { $('#out').textContent = 'error: ' + (e.message || e); }
}
function quick(v) { $('#cmd').value = v === 'backup' ? 'backup' : v; runCmd(); }

async function runFoxJob(argv) {
  const r = await provider.api('POST', '/api/cmd', { body: JSON.stringify(rpcFromArgv(argv)) });
  if (!r.ok) throw new Error('job submit failed: ' + r.status);
  const j = r.json();
  if (!j.id) throw new Error('job submit returned no id');
  let off = 0, out = '';
  for (;;) {
    const o = await provider.api('GET', '/api/jobs/' + j.id + '/output?offset=' + off);
    if (!o.ok) throw new Error('job output failed: ' + o.status);
    const s = o.json();
    if (s.data) out += s.data;
    off = s.offset;
    if (s.state === 'done') {
      if (s.exit_code !== 0) throw new Error(out || ('job failed: ' + s.exit_code));
      return out;
    }
    await new Promise(resolve => setTimeout(resolve, 250));
  }
}

function ttydUrl(port = 7681) {
  let host = $('#host').value.trim() || location.hostname || 'localhost';
  if (host.includes('/')) {
    try { host = new URL(host).hostname; } catch (e) {}
  }
  if (host.startsWith('[')) host = host.slice(1, host.indexOf(']'));
  else if (host.includes(':')) host = host.split(':')[0];
  return 'http://' + host + ':' + port + '/';
}

async function startTtyd() {
  if (!connected) { $('#ttyd-status').textContent = 'connect first'; return; }
  $('#ttyd-status').textContent = 'starting...';
  try {
    const out = await runFoxJob(['webserver', 'terminal', 'start']);
    const portM = out.match(/port=(\d+)/);
    const url = ttydUrl(portM ? parseInt(portM[1], 10) : 7681);
    $('#ttyd-frame').src = url;
    $('#ttyd-status').textContent = url;
  } catch (e) {
    warn('ttyd start failed', e);
    $('#ttyd-status').textContent = e.message || 'ttyd start failed';
  }
}

async function stopTtyd() {
  if (!connected) { $('#ttyd-status').textContent = 'connect first'; return; }
  try {
    await runFoxJob(['webserver', 'terminal', 'stop']);
    $('#ttyd-frame').removeAttribute('src');
    $('#ttyd-status').textContent = 'stopped';
  } catch (e) {
    warn('ttyd stop failed', e);
    $('#ttyd-status').textContent = e.message || 'ttyd stop failed';
  }
}

function openTtyd() {
  const url = $('#ttyd-frame').src || ttydUrl();
  $('#ttyd-frame').src = url;
  window.open(url, '_blank', 'noopener');
}

$('#ttyd-start').addEventListener('click', startTtyd);
$('#ttyd-stop').addEventListener('click', stopTtyd);
$('#ttyd-open').addEventListener('click', openTtyd);

async function pollJob() {
  if (!curJob) return;
  try {
    const r = await provider.api('GET', '/api/jobs/' + curJob + '/output?offset=' + curOff);
    if (r.ok) {
      const j = r.json();
      if (j.data) { $('#out').textContent += j.data; $('#out').scrollTop = $('#out').scrollHeight; }
      curOff = j.offset;
      if (j.state === 'done') { $('#out').textContent += '\n[exit ' + j.exit_code + ']\n'; curJob = 0; return; }
    }
  } catch (e) {}
  pollTimer = setTimeout(pollJob, 600);
}

// Boot: default to REST (served from the device), prefill the device IP (a saved
// one, else the IP this page was loaded from) and a saved token, then try to
// attach. The USB provider only activates when its tab is chosen.
$('#host').value = localStorage.getItem('foxhost') || location.hostname || '';
$('#token').value = RestProvider.token;
refreshStatus().then(() => { if (connected && window._control !== false) provider.startScreen(screenEl()); });
setInterval(() => {
  if (isRestProvider()) refreshStatus();
}, 5000);
</script>
